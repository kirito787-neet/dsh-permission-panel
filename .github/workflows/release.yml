name: release

# 发版流程：推一个 v* tag → 跑测试 → 发布到 npm → 建 GitHub Release。
#
# 为什么以 tag 为准而不是以分支为准：tag 是不可变的发布快照，能在事后回答
# 「npm 上那个 3.2.0 到底是哪份代码」。落在分支上的自动发布会把每个普通提交
# 都变成一个版本号，版本号随即失去意义。

on:
  push:
    tags:
      - "v*"
  # 手动补发：给一个已存在的 tag，走同一条路径，便于首次发布或补建 Release。
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已有 tag（例如 v3.2.0）"
        required: true
        type: string

permissions:
  contents: write # 创建 GitHub Release
  id-token: write # npm Trusted Publishing 的 OIDC 凭据（顺带自动产出 provenance）

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 测试是纯 Node 自带的，不需要 npm install。
      - name: npm test
        run: npm test

  publish:
    name: 发布
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      # registry-url 只用来让 npm 知道往哪个 registry 发；这里刻意不传 token，
      # 让 npm CLI 走 OIDC（它会自动发现 id-token 环境并优先使用）。
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # setup-node 会往 $NPM_CONFIG_USERCONFIG 写一行
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`。本工作流没有这个 env，
      # 展开后是一行空的 _authToken——而 npm 会优先用「存在但为空」的凭据，
      # 把 OIDC 挡在后面，报一个看不懂的 401。所以把它换成只声明 registry 的文件。
      - name: 清掉 .npmrc 里的空 token 行
        run: |
          printf 'registry=https://registry.npmjs.org/\n' > "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          echo "NPM_CONFIG_USERCONFIG=${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          cat "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

      # Trusted Publishing 需要 npm CLI >= 11.5.1；旧版会静默退回 token 认证然后 401。
      - name: 确认 npm 支持 Trusted Publishing
        run: |
          version="$(npm --version)"
          echo "npm $version"
          node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) {
              console.error("npm " + process.argv[1] + " 太旧，Trusted Publishing 需要 >= 11.5.1");
              process.exit(1);
            }
          ' "$version"

      # tag 与 package.json 必须说同一个版本号，否则会发出一个「名字和内容不符」的包，
      # 而 npm 不允许覆盖已发布版本，错了只能改名重发。
      - name: 校验 tag 与 package.json 版本一致
        run: |
          node -e '
            const version = require("./package.json").version;
            const tag = process.env.TAG.replace(/^v/, "");
            if (version !== tag) {
              console.error("tag " + process.env.TAG + " does not match package.json version " + version);
              process.exit(1);
            }
            console.log("version ok: " + version);
          '

      # 凭据来自 OIDC：GitHub 签发一张短期、绑定「本仓库 + 本工作流」的一次性 token，
      # 由 npm 侧登记过的 trusted publisher 关系验证。仓库里没有任何长期 npm 密钥，
      # 因此也不存在 90 天轮换的问题。发布成功时 provenance 证明会自动附带
      # （公开仓库 + 公开包），无需再写 --provenance。
      - name: 发布到 npm（Trusted Publishing / OIDC）
        run: |
          if ! npm publish --access public; then
            echo "::error::npm 发布失败。若错误是 404 / 401 / EOTP，最常见的原因是 npm 侧还没有为本仓库登记 trusted publisher。"
            echo "::error::打开 https://www.npmjs.com/package/${NPM_PACKAGE}/access ，在 Trusted Publisher 里添加 GitHub Actions："
            echo "::error::   Organization or user = ${GITHUB_REPOSITORY%%/*} ，Repository = ${GITHUB_REPOSITORY#*/} ，Workflow filename = release.yml"
            echo "::error::并在 Allowed actions 里勾上 npm publish。登记后重跑本工作流（新建的配置要在 2 天内完成首次发布，否则会过期）。"
            exit 1
          fi
        env:
          NPM_PACKAGE: ${{ github.event.repository.name }}

      # Release 放在发布之后：npm 那一步失败就直接失败，不会留下「GitHub 上有版本、
      # npm 上没有」的假象。反过来（npm 有、Release 没建成）重跑本工作流即可补齐。
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
